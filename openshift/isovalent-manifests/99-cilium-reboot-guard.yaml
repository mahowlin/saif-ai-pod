# Cilium Reboot Guard MachineConfig for SNO Day 1 Deployment
#
# Problem: During OVN→Cilium migration, MCO re-renders MachineConfigs when
#          NetworkType changes, causing ovs-configuration.service to change.
#          MCD detects the unit diff and triggers reboot via:
#            systemd-run ... systemctl reboot → reboot.target
#          This happens before Cilium is healthy, creating an infinite boot loop.
#
# Solution: On first boot only (before migration-complete marker exists):
#   1. cilium-reboot-mask.service masks reboot.target BEFORE kubelet starts
#   2. cilium-reboot-guard.service unmasks AFTER Cilium is healthy
#   On subsequent boots, both services skip (marker exists). MCD can reboot freely.
#
# Bug fix (2026-02-05): Removed declarative mask: true entries that caused MCD to
#   re-create mask symlinks on every config apply, blocking Day 2 reboots.
#   See plans/CILIUM_REBOOT_GUARD_BUG_REVIEW.md for full analysis.
#
# Validated: example-node-1 Day 2 migration (2026-01-18), reboot survival (2026-01-19)
#
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-cilium-reboot-guard
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.2.0
    systemd:
      units:
        # Runtime mask: blocks reboot BEFORE kubelet starts (first boot only)
        # Runs early so the mask is in place before MCO controller pod can
        # trigger MCD reboot via ovs-configuration.service unit diff.
        - name: cilium-reboot-mask.service
          enabled: true
          contents: |
            [Unit]
            Description=Mask reboot during Cilium migration (first boot only)
            Before=kubelet.service
            ConditionPathExists=!/var/lib/cilium-migration-complete

            [Service]
            Type=oneshot
            ExecStart=/usr/bin/systemctl mask reboot.target systemd-reboot.service
            ExecStart=/bin/echo "Cilium Reboot Mask: reboot.target masked until Cilium is healthy"
            RemainAfterExit=yes

            [Install]
            WantedBy=multi-user.target
        # Unmask service: waits for Cilium agent, then allows reboot (first boot only)
        - name: cilium-reboot-guard.service
          enabled: true
          contents: |
            [Unit]
            Description=Unmask reboot after Cilium is healthy
            After=kubelet.service cilium-reboot-mask.service
            Requires=cilium-reboot-mask.service
            ConditionPathExists=!/var/lib/cilium-migration-complete

            [Service]
            Type=oneshot
            # Wait for cilium-agent container, then wait 60s for stability, then unmask
            ExecStart=/bin/bash -c '\
              echo "Cilium Reboot Guard: Waiting for Cilium agent..."; \
              until /usr/bin/crictl ps 2>/dev/null | grep -q cilium-agent; do \
                sleep 10; \
                echo "Cilium Reboot Guard: Still waiting..."; \
              done; \
              echo "Cilium Reboot Guard: Cilium agent detected, waiting 60s for stability..."; \
              sleep 60; \
              echo "Cilium Reboot Guard: Unmasking reboot.target..."; \
              systemctl unmask reboot.target systemd-reboot.service; \
              echo "Cilium Reboot Guard: Complete - reboot now allowed"'
            RemainAfterExit=yes
            TimeoutStartSec=600

            [Install]
            WantedBy=multi-user.target
