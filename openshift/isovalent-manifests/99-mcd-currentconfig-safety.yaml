# MCD currentconfig Safety Net
#
# Problem: On some deploys, machine-config-daemon-firstboot detects "no changes"
#          between the on-disk state and the bootstrap rendered MachineConfig
#          (because ignition already wrote all files). When this happens, firstboot
#          skips writing /etc/machine-config-daemon/currentconfig. The in-cluster
#          MCD pod then enters bootstrap mode, hits strict validation that fails
#          on IDMS-generated file diffs, and marks MCO Degraded permanently.
#
# Solution: After firstboot completes, if currentconfig doesn't exist, create it
#           from the bootstrap MCS content file with a MODIFIED MC name. The name
#           change is critical: if currentconfig's MC name matches the bootstrap MC
#           name, MCD enters strict bootstrap validation and rejects any diff
#           (whitespace, IDMS files). By renaming, MCD enters NORMAL update mode
#           and handles diffs through the standard apply+reboot path.
#
# Timing: Runs after machine-config-daemon-firstboot, before kubelet starts.
#         Takes <1 second. Only runs when the file is missing (ConditionPathExists).
#
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-mcd-currentconfig-safety
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.2.0
    systemd:
      units:
        - name: mcd-currentconfig-safety.service
          enabled: true
          contents: |
            [Unit]
            Description=Ensure MCD currentconfig exists for bootstrap
            After=machine-config-daemon-firstboot.service
            Before=kubelet-dependencies.target
            ConditionPathExists=/etc/mcs-machine-config-content.json
            ConditionPathExists=!/etc/machine-config-daemon/currentconfig

            [Service]
            Type=oneshot
            ExecStart=/bin/bash -c 'sed "0,/rendered-master-/s/rendered-master-/mcd-safety-net-/" /etc/mcs-machine-config-content.json > /etc/machine-config-daemon/currentconfig'
            ExecStartPost=/bin/echo "MCD Safety: Created currentconfig with modified MC name (bypass bootstrap validation)"
            RemainAfterExit=yes

            [Install]
            WantedBy=multi-user.target
