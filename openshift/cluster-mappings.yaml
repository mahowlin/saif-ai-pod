# Cluster definitions for all 4 SNO clusters
#
# Ordering: GPU servers first (slots 1, 3), then non-GPU (slots 5, 7)
# - ai-pod-1, ai-pod-2: SNO + NVAIE (L40S GPU)
# - ai-pod-3, ai-pod-4: SNO only (no GPU)
#
# NOTE: installation_disk is DEPRECATED and no longer used.
# The agent-config template uses rootDeviceHints.model for boot disk selection.
# Device names (sda, sdb, etc.) are NOT stable between boots on UCS MRAID.
#
# boot_disk_model values:
#   - "CISCO_VD" for servers with M.2 RAID (virtual disk from MRAID RAID-1)
#   - "Micron_5400_MTFD" for servers with single M.2 (no RAID)

infrastructure:
  base_domain: example.com
  vlan: 100
  network_cidr: 10.0.1.0/24
  gateway: 10.0.1.1
  dns_servers:
    - 10.0.0.53
    - 10.0.0.54
  registry:
    hostname: registry.example.com
    port: 5000

  cluster_network:
    cidr: 10.128.0.0/14
    host_prefix: 23
  # Cilium uses a non-overlapping CIDR (required for OVN→Cilium migration)
  # See FlashStack CVD page 100: "must not overlap with existing OVN-Kubernetes network"
  cilium_network:
    cidr: 10.253.0.0/16
    host_prefix: 24
  service_network:
    - 172.30.0.0/16

  image_content_sources:
    - source: quay.io/openshift-release-dev/ocp-release
      mirrors:
        - registry.example.com:5000/openshift/release-images
    - source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
      mirrors:
        - registry.example.com:5000/openshift/release
    - source: registry.redhat.io/ubi9
      mirrors:
        - registry.example.com:5000/ubi9/ubi9
    - source: quay.io/isovalent
      mirrors:
        - registry.example.com:5000/isovalent

clusters:
  # GPU servers (L40S) - SNO + NVAIE
  - name: ai-pod-1
    enabled: true
    openshift_version: "4.19"
    ucs_profile: saif-ai-pod-1
    serial: SERIALNUMBER01
    ip: 10.0.1.101
    hostname: cluster-1.example.com
    interface: bond0
    boot_disk_model: "CISCO_VD"  # M.2 RAID
    gpu:
      model: NVIDIA L40S
      count: 1

  - name: ai-pod-2
    enabled: true
    openshift_version: "4.19"
    ucs_profile: saif-ai-pod-2
    serial: SERIALNUMBER02
    ip: 10.0.1.102
    hostname: cluster-2.example.com
    interface: bond0
    boot_disk_model: "CISCO_VD"  # M.2 RAID
    gpu:
      model: NVIDIA L40S
      count: 1

  # Non-GPU servers - SNO only
  - name: ai-pod-3
    enabled: true
    openshift_version: "4.19"
    ucs_profile: saif-ai-pod-3
    serial: SERIALNUMBER03
    ip: 10.0.1.103
    hostname: cluster-3.example.com
    interface: bond0
    boot_disk_model: "Micron_5400_MTFD"  # Single M.2 (no RAID)

  - name: ai-pod-4
    enabled: true
    openshift_version: "4.19"
    ucs_profile: saif-ai-pod-4
    serial: SERIALNUMBER04
    ip: 10.0.1.104
    hostname: cluster-4.example.com
    interface: bond0
    boot_disk_model: "Micron_5400_MTFD"  # Single M.2 (no RAID)
