# Patch FeatureGate to disable BareMetalLoadBalancer
#
# OCP 4.19 enables BareMetalLoadBalancer by default, which creates OVS flows
# that compete with Cilium for LoadBalancer traffic. This MachineConfig
# patches the FeatureGate to disable BareMetalLoadBalancer once the API
# is available during cluster bootstrap.
#
# Note: We cannot use FeatureGate manifest or install-config featureSet because:
# - Separate manifest: assisted-service adds suffix causing duplicate
# - install-config featureSet: Agent-Based Installer doesn't support it
#
# This approach waits for the API to become available, then patches the
# FeatureGate using the node's recovery kubeconfig.
#
# Reference: FEATUREGATE_OVS_FLOW_FIX.md

apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-patch-featuregate
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.4.0
    systemd:
      units:
        - name: patch-featuregate.service
          enabled: true
          contents: |
            [Unit]
            Description=Patch FeatureGate to disable BareMetalLoadBalancer
            After=kubelet.service crio.service
            # Only run once - skip if already patched
            ConditionPathExists=!/var/lib/featuregate-patched

            [Service]
            Type=oneshot
            Environment=KUBECONFIG=/etc/kubernetes/static-pod-resources/kube-apiserver-certs/secrets/node-kubeconfigs/localhost-recovery.kubeconfig
            # Wait for API to become available (can take 15-30 min on fresh install)
            ExecStartPre=/bin/bash -c 'echo "Waiting for Kubernetes API..."; until /usr/bin/oc get featuregate cluster 2>/dev/null; do sleep 30; done; echo "API available"'
            # Patch the FeatureGate to disable BareMetalLoadBalancer
            ExecStart=/bin/bash -c '/usr/bin/oc patch featuregate cluster --type=merge -p '\''{"spec":{"featureSet":"CustomNoUpgrade","customNoUpgrade":{"disabled":["BareMetalLoadBalancer"]}}}'\'' && echo "FeatureGate patched successfully"'
            # Mark as done so we don't run again
            ExecStartPost=/bin/touch /var/lib/featuregate-patched
            RemainAfterExit=yes
            # Long timeout - API may take a while to come up
            TimeoutStartSec=3600

            [Install]
            WantedBy=multi-user.target
