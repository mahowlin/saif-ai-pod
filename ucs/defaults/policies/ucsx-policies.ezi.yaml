---
#========================================
#   SAIF AI Pod Compute & Management Policies
#   Naming convention: saif-example-node-{policy-type}
#========================================
cpa-infra:
  policies:
    #----------------------------------------
    # BIOS Policy - Standard (no GPU)
    #----------------------------------------
    bios:
      - name: saif-example-node-bios
        description: "AI Pod BIOS policy - standard (no GPU)"
        bios_settings:
          ProcessorC6report: enabled
          WorkLoadConfig: Balanced

      #----------------------------------------
      # BIOS Policy - GPU Enabled (L40S)
      # For servers with NVIDIA L40S GPU (example-node-1, example-node-2)
      # Key settings: Above 4G decoding, NUMA optimization
      #----------------------------------------
      - name: saif-example-node-bios-gpu
        description: "AI Pod BIOS policy - GPU enabled (L40S)"
        bios_settings:
          # Base settings
          ProcessorC6report: enabled
          WorkLoadConfig: Balanced
          # GPU enablement - CRITICAL for L40S visibility
          memory_mapped_io_above4gb: enabled    # Required for large GPU BAR
          numa_optimized: enabled               # Better GPU performance

    #----------------------------------------
    # Boot Order Policy - M.2 RAID primary, CIMC DVD secondary
    #----------------------------------------
    boot_order:
      - name: saif-example-node-boot
        description: "AI Pod boot order - M.2 RAID primary, CIMC DVD secondary"
        boot_mode: Uefi
        enable_secure_boot: false
        boot_devices:
          - device_name: disk
            device_type: local_disk
            enabled: true
            slot: MSTOR-RAID
          - device_name: CIMC-DVD
            device_type: virtual_media
            enabled: true
            subtype: cimc-mapped-dvd

    #----------------------------------------
    # Storage Policy - M.2 RAID (for servers with 2 M.2 disks)
    #----------------------------------------
    storage:
      - name: saif-example-node-storage
        description: "AI Pod storage policy - M.2 RAID boot"
        m2_raid_configuration:
          slot: MSTOR-RAID-1
          name: MStorBootVd
        unused_disks_state: NoChange
        use_jbod_for_vd_creation: false

      #----------------------------------------
      # Storage Policy - No RAID (for servers with 1 M.2 disk)
      #----------------------------------------
      - name: saif-example-node-storage-noraid
        description: "AI Pod storage policy - Single M.2 disk (no RAID)"
        unused_disks_state: NoChange
        use_jbod_for_vd_creation: false

      #----------------------------------------
      # Storage Policy - M.2 RAID + NVMe JBOD (for example-node-2, example-node-3)
      # Exposes NVMe drives as individual disks for mdadm RAID
      #----------------------------------------
      - name: saif-example-node-storage-nvme-jbod
        description: "AI Pod storage - M.2 RAID boot + NVMe JBOD for data"
        m2_raid_configuration:
          slot: MSTOR-RAID-1
          name: MStorBootVd
        unused_disks_state: Jbod
        use_jbod_for_vd_creation: true

      #----------------------------------------
      # Storage Policy - Single M.2 + NVMe JBOD (for example-node-1, example-node-4)
      # Exposes NVMe drives as individual disks for mdadm RAID
      #----------------------------------------
      - name: saif-example-node-storage-nvme-jbod-noraid
        description: "AI Pod storage - Single M.2 boot + NVMe JBOD for data"
        unused_disks_state: Jbod
        use_jbod_for_vd_creation: true

    #----------------------------------------
    # IMC Access Policy - Inband VLAN 2134, OOB enabled
    #----------------------------------------
    imc_access:
      - name: saif-example-node-imc-access
        description: "AI Pod IMC access - inband VLAN 2134"
        inband_ip_pool: saif-example-node-inband-ip-pool
        inband_vlan_id: 134
        ipv4_address_configuration: true
        ipv6_address_configuration: false
        out_of_band_ip_pool: saif-example-node-oob-ip-pool

    #----------------------------------------
    # Local User Policy - Admin user, password via env var
    #----------------------------------------
    local_user:
      - name: saif-example-node-local-user
        description: "AI Pod local user - admin only, password expiry disabled"
        password_properties:
          enable_password_expiry: false
          enforce_strong_password: false
          always_send_user_password: false
          grace_period: 0
          notification_period: 15
          password_expiry_duration: 90
          password_history: 5
        users:
          - username: admin
            role: admin
            enabled: true
            password: 1

    #----------------------------------------
    # Virtual KVM Policy - Enabled with encryption
    #----------------------------------------
    virtual_kvm:
      - name: saif-example-node-vkvm
        description: "AI Pod virtual KVM - enabled with encryption"
        enabled: true
        enable_local_server_video: true
        enable_video_encryption: true
        maximum_sessions: 4
        remote_port: 2068
        tunneled_kvm_enabled: true
    #----------------------------------------
    # Scrub Policy - Disk scrub enabled
    #----------------------------------------
    scrub:
      - name: saif-example-node-scrub
        description: "AI Pod scrub policy - disk scrub enabled"
        disk_scrub: true
        bios_scrub: false
        flexflash_scrub: false
