---
#========================================
# example-node-4: Non-GPU server, single M.2
# Slot 7, Serial SERIALNUMBER04
#
# Profile with private execution policies; generated LAN connectivity is source-owned.
# Moving this file to inactive/ removes its target-owned resources, not generated LAN data.
#========================================
cpa-infra:
  policies:
    #----------------------------------------
    # Per-profile vMedia (unique ISO path per server)
    #----------------------------------------
    virtual_media:
      - name: saif-example-node-4-vmedia
        description: "AI Pod 4 vMedia - isolated"
        enabled: true
        encryption: true
        low_power_usb: true

    #----------------------------------------
    # Per-profile LAN Connectivity (triggers unique MAC allocation)
    #----------------------------------------
    #----------------------------------------
    # Per-profile Local User (avoids conflicts between profiles)
    #----------------------------------------
    local_user:
      - name: saif-example-node-4-local-user
        description: "AI Pod 4 local user - admin only"
        password_properties:
          enable_password_expiry: false
          enforce_strong_password: false
          always_send_user_password: false
          grace_period: 0
          notification_period: 15
          password_expiry_duration: 90
          password_history: 5
        users:
          - username: admin_4
            role: admin
            enabled: true
            password: 1

  profiles:
    server:
      - name: saif-example-node-4
        description: "SAIF AI Pod 4 - Slot 7, no GPU, 1x M.2"
        action: No-op
        target_platform: FIAttached
        attach_template: false
        uuid_pool: saif-example-node-uuid-pool
        # Shared policies (defined in policies/*.ezi.yaml)
        bios_policy: saif-example-node-bios
        boot_order_policy: saif-example-node-boot
        storage_policy: saif-example-node-storage-nvme-jbod-noraid
        imc_access_policy: saif-example-node-imc-access
        virtual_kvm_policy: saif-example-node-vkvm
        scrub_policy: saif-example-node-scrub
        firmware_policy: saif-example-node-firmware
        # Per-profile policies (defined above in this file)
        local_user_policy: saif-example-node-4-local-user
        virtual_media_policy: saif-example-node-4-vmedia
        lan_connectivity_policy: saif-example-node-4-lan
        targets:
          - name: saif-example-node-4
            serial_number: EXAMPLE370W3
