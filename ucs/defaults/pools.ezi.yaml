---
#========================================
#   Pools - SAIF AI Pod
#   Naming convention: saif-example-node-{pool-type}
#========================================
cpa-infra:
  pools:
    #----------------------------------------
    # UUID Pool - For server identity
    #----------------------------------------
    uuid:
      - name: saif-example-node-uuid-pool
        description: "SAIF AI Pod UUID Pool for server identity"
        assignment_order: sequential
        prefix: "000025B5-0000-0000"
        uuid_blocks:
          - from: "0000-000000000001"
            size: 16

    #----------------------------------------
    # MAC Pool - For vNIC MAC addresses
    #----------------------------------------
    mac:
      - name: saif-example-node-mac-pool
        description: "SAIF AI Pod MAC Pool for vNICs"
        assignment_order: sequential
        mac_blocks:
          - from: "00:00:00:00:00:10"
            size: 32

    #----------------------------------------
    # Inband IP Pool - VLAN 2134 (dc-inb-mgmt)
    #----------------------------------------
    ip:
      - name: saif-example-node-inband-ip-pool
        description: "SAIF AI Pod Inband Management IP Pool - VLAN 2134"
        assignment_order: sequential
        ipv4_blocks:
          - from: 10.0.2.6
            size: 4
        ipv4_configuration:
          gateway: 10.0.2.1
          netmask: 255.255.255.0
          primary_dns: 10.0.3.1

      #----------------------------------------
      # OOB IP Pool - VLAN 2130 (saif-oob-mgmt)
      #----------------------------------------
      - name: saif-example-node-oob-ip-pool
        description: "SAIF AI Pod Out-of-Band Management IP Pool - VLAN 2130"
        assignment_order: sequential
        ipv4_blocks:
          - from: 10.0.0.20
            size: 4
        ipv4_configuration:
          gateway: 10.0.0.1
          netmask: 255.255.254.0
          primary_dns: 10.0.3.1
