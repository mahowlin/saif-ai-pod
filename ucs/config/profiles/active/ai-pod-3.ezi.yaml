---
#========================================
# ai-pod-3: Non-GPU server, single M.2
# Slot 5, Serial SERIALNUMBER03
#
# Self-contained profile with per-profile policies.
# Moving this file to inactive/ removes profile AND its policies.
#========================================
cpa-infra:
  policies:
    #----------------------------------------
    # Per-profile vMedia (unique ISO path per server)
    #----------------------------------------
    virtual_media:
      - name: saif-ai-pod-3-vmedia
        description: "AI Pod 3 vMedia - isolated"
        enabled: true
        encryption: true
        low_power_usb: true

    #----------------------------------------
    # Per-profile LAN Connectivity (triggers unique MAC allocation)
    #----------------------------------------
    lan_connectivity:
      - name: saif-ai-pod-3-lan
        description: "AI Pod 3 LAN Connectivity - Dual vNIC"
        target_platform: FIAttached
        iqn_allocation_type: None
        vnics:
          - names:
              - eth0
              - eth1
            cdn_source: vnic
            enable_failover: false
            mac_address_pools:
              - saif-ai-pod-mac-pool
              - saif-ai-pod-mac-pool
            ethernet_adapter_policy: saif-ai-pod-eth-adapter
            ethernet_qos_policy: saif-ai-pod-eth-qos
            ethernet_network_control_policy: saif-ai-pod-eth-ctrl
            ethernet_network_group_policies:
              - saif-ai-pod-eth-net-group
            placement:
              pci_order:
                - 0
                - 1
              switch_ids:
                - A
                - B
              automatic_slot_id_assignment: true
              automatic_pci_link_assignment: true
            vmq:
              enabled: true
              number_of_interrupts: 16
              number_of_virtual_machine_queues: 4

    #----------------------------------------
    # Per-profile Local User (avoids conflicts between profiles)
    #----------------------------------------
    local_user:
      - name: saif-ai-pod-3-local-user
        description: "AI Pod 3 local user - admin only"
        password_properties:
          enable_password_expiry: false
          enforce_strong_password: false
          always_send_user_password: false
          grace_period: 0
          notification_period: 15
          password_expiry_duration: 90
          password_history: 5
        users:
          - username: admin_3
            role: admin
            enabled: true
            password: 1

  profiles:
    server:
      - name: saif-ai-pod-3
        description: "SAIF AI Pod 3 - Slot 5, no GPU, 1x M.2"
        action: No-op
        target_platform: FIAttached
        attach_template: false
        uuid_pool: saif-ai-pod-uuid-pool
        # Shared policies (defined in policies/*.ezi.yaml)
        bios_policy: saif-ai-pod-bios
        boot_order_policy: saif-ai-pod-boot
        storage_policy: saif-ai-pod-storage-nvme-jbod-noraid
        imc_access_policy: saif-ai-pod-imc-access
        virtual_kvm_policy: saif-ai-pod-vkvm
        scrub_policy: saif-ai-pod-scrub
        firmware_policy: saif-ai-pod-firmware
        # Per-profile policies (defined above in this file)
        local_user_policy: saif-ai-pod-3-local-user
        virtual_media_policy: saif-ai-pod-3-vmedia
        lan_connectivity_policy: saif-ai-pod-3-lan
        targets:
          - name: saif-ai-pod-3
            serial_number: SERIALNUMBER03
