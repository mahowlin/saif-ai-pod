---
#========================================
#   Domain Profile - SAIF AI Pod
#   Manages Fabric Interconnect configuration
#========================================
cpa-infra:
  profiles:
    domain:
      - name: saif-ai-pod-dom
        description: "SAIF AI Pod Domain Profile"
        action: No-op  # Deploy triggered via isctl in workflow
        attach_template: true
        ucs_domain_profile_template: saif-ai-pod-dom-template
        serial_numbers:
          - SERIALNUMBER05  # FI-A
          - SERIALNUMBER06  # FI-B

        # Policies with saif-ai-pod-dom-* naming
        vlan_policies:
          - saif-ai-pod-dom-vlan
        port_policies:
          - saif-ai-pod-dom-portpol
        system_qos_policy: saif-ai-pod-dom-qospol

        # Shared lab policy (keep existing)
        ntp_policy: saif-ntp

        # Unused policies
        vsan_policies:
          - UNUSED
        network_connectivity_policy: UNUSED
        snmp_policy: UNUSED
        switch_control_policy: UNUSED
        syslog_policy: UNUSED
        certificate_management_policy: UNUSED
        ldap_policy: UNUSED
