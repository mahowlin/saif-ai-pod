---
#========================================
#   Ethernet Network Group Policies - SAIF AI Pod
#   Naming convention: saif-ai-pod-{policy-type}
#========================================
cpa-infra:
  policies:
    ethernet_network_group:
      #----------------------------------------
      # Server vNIC Ethernet Network Group
      # Native VLAN 100 for OpenShift servers (untagged traffic)
      #----------------------------------------
      - name: saif-ai-pod-eth-net-group
        description: "Server vNIC VLAN configuration - VLAN 100 native for OpenShift"
        allowed_vlans: "100"
        native_vlan: 100
