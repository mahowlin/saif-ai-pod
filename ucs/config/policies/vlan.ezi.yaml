---
#========================================
#   VLAN Policies - SAIF AI Pod
#   Domain VLAN policy for FI uplinks
#   Server VLAN policy for vNICs
#========================================
cpa-infra:
  policies:
    vlan:
      #----------------------------------------
      # Domain VLAN Policy - For Fabric Interconnects
      # VLAN 1 is native (default), VLAN 100 is tagged
      #----------------------------------------
      - name: saif-ai-pod-dom-vlan
        vlans:
          - name: default
            vlan_list: "1"
            native_vlan: true
            auto_allow_on_uplinks: true
            multicast_policy: saif-ai-pod-multicast
          # VLAN 100 auto-allowed on uplinks (tagged traffic to ACI vPC)
          - name: ocp_100
            vlan_list: "100"
            auto_allow_on_uplinks: true
            multicast_policy: saif-ai-pod-multicast
          # VLAN 134 for IMC inband management (required by access policy)
          - name: imc_134
            vlan_list: "134"
            auto_allow_on_uplinks: true
            multicast_policy: saif-ai-pod-multicast

      #----------------------------------------
      # Server VLAN Policy - For vNIC configuration
      # Only VLAN 100 for OpenShift servers
      #----------------------------------------
      - name: saif-ai-pod-vlan
        vlans:
          - name: ocp-ai-pod
            vlan_list: "100"
            auto_allow_on_uplinks: false
            multicast_policy: saif-ai-pod-multicast
