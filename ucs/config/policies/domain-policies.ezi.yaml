---
#========================================
#   Domain Policies - SAIF AI Pod
#   Policies for Fabric Interconnect configuration
#========================================
cpa-infra:
  policies:
    #----------------------------------------
    # Port Policy for UCS-X 9108 IFM
    #----------------------------------------
    port:
      - names:
          - saif-ai-pod-dom-portpol
        description: "SAIF AI Pod Domain Port Policy"
        device_model: UCSX-S9108-100G
        # Server ports are mapped internally by the IFM - no configuration needed
        # Ethernet uplink port-channel (vPC to ACI)
        # VLANs controlled via auto_allow_on_uplinks in VLAN policy
        # No EthNetworkGroupPolicy - UCSX IFM uses VLAN policy for uplink VLANs
        port_channel_ethernet_uplinks:
          - pc_ids: [1]
            admin_speed: 100Gbps
            fec: Cl91
            interfaces:
              - port_id: 1
                slot_id: 1
              - port_id: 5
                slot_id: 1

    #----------------------------------------
    # System QoS Policy - Jumbo Frames enabled
    #----------------------------------------
    system_qos:
      - name: saif-ai-pod-dom-qospol
        description: "SAIF AI Pod Domain QoS - Jumbo Frames"
        jumbo_mtu: true
        classes:
          - priority: Best Effort
            state: Enabled
            bandwidth_percent: 50
            cos: 255
            packet_drop: true
            weight: 5
          - priority: FC
            state: Enabled
            bandwidth_percent: 50
            cos: 3
            packet_drop: false
            weight: 5
          - priority: Bronze
            state: Disabled
            cos: 1
            weight: 7
          - priority: Silver
            state: Disabled
            cos: 2
            weight: 8
          - priority: Gold
            state: Disabled
            cos: 4
            weight: 9
          - priority: Platinum
            state: Disabled
            cos: 5
            weight: 10
