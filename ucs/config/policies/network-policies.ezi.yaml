---
#========================================
#   SAIF AI Pod Network Policies
#   Naming convention: saif-ai-pod-{policy-type}
#========================================
cpa-infra:
  policies:
    #----------------------------------------
    # Multicast Policy - Required by VLAN policy
    #----------------------------------------
    multicast:
      - name: saif-ai-pod-multicast
        description: "SAIF AI Pod multicast policy for VLAN traffic"
        querier_state: Disabled
        snooping_state: Enabled

    #----------------------------------------
    # Ethernet Adapter Policy - VMware optimized settings
    #----------------------------------------
    ethernet_adapter:
      - name: saif-ai-pod-eth-adapter
        description: "SAIF AI Pod Ethernet Adapter - VMware optimized"
        enable_vxlan_offload: false
        enable_nvgre_offload: false
        enable_arfs: false
        enable_geneve_offload: false
        completion_queue_count: 5
        completion_ring_size: 1
        interrupt_settings:
          coalescing_time: 125
          coalescing_type: MIN
          interrupts: 8
          mode: MSIx
        receive_queue_count: 4
        receive_ring_size: 512
        rss_settings: true
        tcp_offload_settings:
          large_receive: true
          large_send: true
          rx_checksum: true
          tx_checksum: true
        transmit_queue_count: 1
        transmit_ring_size: 256
        uplink_failback_timeout: 5

    #----------------------------------------
    # Ethernet QoS Policy - Jumbo Frames (MTU 9000 max for vNIC)
    #----------------------------------------
    ethernet_qos:
      - name: saif-ai-pod-eth-qos
        description: "SAIF AI Pod Ethernet QoS - Jumbo Frames"
        burst: 10240
        cos: 0
        mtu: 9000
        priority: Best Effort
        rate_limit: 0
        trust_host_cos: false
        enable_trust_host_cos: false

    #----------------------------------------
    # Ethernet Network Control Policy - CDP/LLDP enabled
    #----------------------------------------
    ethernet_network_control:
      - name: saif-ai-pod-eth-ctrl
        description: "SAIF AI Pod Ethernet Network Control - CDP/LLDP enabled"
        cdp_enable: true
        lldp_receive_enable: true
        lldp_transmit_enable: false
        mac_register_mode: nativeVlanOnly
        mac_security_forge: allow
        uplink_fail_action: linkDown
