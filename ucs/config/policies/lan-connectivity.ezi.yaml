---
#========================================
#   SAIF AI Pod LAN Connectivity Policy
#   Uses inline vnics - eth0 on Fabric A, eth1 on Fabric B
#========================================
cpa-infra:
  policies:
    lan_connectivity:
      - name: saif-ai-pod-lan
        description: "SAIF AI Pod LAN Connectivity - Dual vNIC"
        target_platform: FIAttached
        iqn_allocation_type: None
        vnics:
          #----------------------------------------
          # eth0 and eth1 - one per fabric
          # names/pci_order/switch_ids arrays are parallel
          #----------------------------------------
          - names:
              - eth0
              - eth1
            cdn_source: vnic
            enable_failover: false
            mac_address_pools:
              - saif-ai-pod-mac-pool
              - saif-ai-pod-mac-pool
            ethernet_adapter_policy: saif-ai-pod-eth-adapter
            ethernet_qos_policy: saif-ai-pod-eth-qos
            ethernet_network_control_policy: saif-ai-pod-eth-ctrl
            ethernet_network_group_policies:
              - saif-ai-pod-eth-net-group
            placement:
              pci_order:
                - 0
                - 1
              switch_ids:
                - A
                - B
              automatic_slot_id_assignment: true
              automatic_pci_link_assignment: true
            # Enable VMQ to bypass Easy-IMM module bug with usnic/vmq for_each
            vmq:
              enabled: true
              number_of_interrupts: 16
              number_of_virtual_machine_queues: 4
