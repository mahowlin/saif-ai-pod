name: 'OpenShift Pipeline'
run-name: "OCP ${{ inputs.cluster_name }}${{ inputs.request_id && format(' [rid={0}]', inputs.request_id) || '' }}"

# Orchestrates the full OpenShift deployment pipeline:
# validate → deploy → post-install → test
#
# Each stage can be independently enabled/disabled for flexible execution:
# - Full deploy: All stages enabled (default)
# - Post-install only: Disable validate+deploy, enable post_install
# - Test only: Disable all except test

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'Target cluster (e.g. example-node-1, example-management)'
        required: true
        type: string
      cni_type:
        description: 'CNI type to deploy (Cilium required for SAIF platform)'
        required: true
        type: choice
        options:
          - Cilium
          - OVN
        default: 'Cilium'

      # Stage toggles (all enabled by default for full deployment)
      validate:
        description: 'Run validation'
        type: boolean
        default: true
      deploy:
        description: 'Run deployment (blocked if cluster operational)'
        type: boolean
        default: true
      post_install:
        description: 'Run post-install (kubeconfig, IDMS, ArgoCD)'
        type: boolean
        default: true
      test:
        description: 'Run tests'
        type: boolean
        default: true
      force_deploy:
        description: 'Force deploy (bypass operational cluster safeguard)'
        type: boolean
        default: false

      post_install_contract:
        description: 'JSON runner paths: cluster_dir, artifact_manifest, raw_target_root, gitops_target_root; required when post_install=true'
        required: false
        type: string
        default: '{}'
      request_id:
        description: 'Orchestrator correlation ID (for run tracking)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Validate private post-install handoff before deployment
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    container:
      image: ${{ vars.RUNNER_CONTAINER_IMAGE }}
    steps:
      - name: Check selected handoff paths
        env:
          POST_INSTALL: ${{ inputs.post_install }}
          POST_INSTALL_CONTRACT: ${{ inputs.post_install_contract }}
        run: |
          python3 - <<'PYTHON'
          import json,os
          from pathlib import Path
          if os.environ['POST_INSTALL'] != 'true':
              raise SystemExit(0)
          contract=json.loads(os.environ['POST_INSTALL_CONTRACT'])
          for key in ('cluster_dir','artifact_manifest','raw_target_root','gitops_target_root'):
              value=contract.get(key)
              if not isinstance(value,str) or not Path(value).is_absolute() or not (Path(value).is_file() if key=='artifact_manifest' else Path(value).is_dir()):
                  raise SystemExit('post_install requires a mounted absolute '+key+' before deployment')
          PYTHON

  validate:
    name: 'Validate'
    needs: preflight
    if: inputs.validate == true
    uses: ./.github/workflows/openshift-validate.yaml
    with:
      cluster_name: ${{ inputs.cluster_name }}
      cni_type: ${{ inputs.cni_type }}
    secrets: inherit

  deploy:
    name: 'Deploy'
    needs: [preflight, validate]
    if: always() && needs.preflight.result == 'success' && inputs.deploy == true && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    uses: ./.github/workflows/openshift-deploy.yaml
    with:
      cluster_name: ${{ inputs.cluster_name }}
      action: 'DEPLOY'
      cni_type: ${{ inputs.cni_type }}
      force_deploy: ${{ inputs.force_deploy }}
    secrets: inherit

  post_install:
    name: 'Post-Install'
    needs: [preflight, validate, deploy]
    if: always() && needs.preflight.result == 'success' && inputs.post_install == true && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    uses: ./.github/workflows/openshift-post-install.yaml
    with:
      cluster_name: ${{ inputs.cluster_name }}
      cluster_dir: ${{ fromJSON(inputs.post_install_contract).cluster_dir || '' }}
      artifact_manifest: ${{ fromJSON(inputs.post_install_contract).artifact_manifest || '' }}
      raw_target_root: ${{ fromJSON(inputs.post_install_contract).raw_target_root || '' }}
      gitops_target_root: ${{ fromJSON(inputs.post_install_contract).gitops_target_root || '' }}
      apply_idms: true
      apply_argocd: true
    secrets: inherit

  test:
    name: 'Test'
    needs: [preflight, validate, deploy, post_install]
    if: always() && needs.preflight.result == 'success' && inputs.test == true && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') && (needs.post_install.result == 'success' || needs.post_install.result == 'skipped')
    uses: ./.github/workflows/openshift-test.yaml
    with:
      cluster_name: ${{ inputs.cluster_name }}
    secrets: inherit

  summary:
    name: 'Pipeline Summary'
    needs: [validate, deploy, post_install, test]
    if: always()
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
    - name: Generate Summary
      run: |
        echo "## OpenShift Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Cluster:** ${{ inputs.cluster_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**CNI:** ${{ inputs.cni_type }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Stage | Enabled | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|---------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Validate | ${{ inputs.validate }} | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Deploy | ${{ inputs.deploy }} | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Post-Install | ${{ inputs.post_install }} | ${{ needs.post_install.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Test | ${{ inputs.test }} | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
