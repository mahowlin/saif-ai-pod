name: 'OpenShift Pipeline'
run-name: "OCP ${{ inputs.cluster_name }}${{ inputs.request_id && format(' [rid={0}]', inputs.request_id) || '' }}"

# Orchestrates the full OpenShift deployment pipeline:
# validate → deploy → post-install → test
#
# Each stage can be independently enabled/disabled for flexible execution:
# - Full deploy: All stages enabled (default)
# - Post-install only: Disable validate+deploy, enable post_install
# - Test only: Disable all except test

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'Target cluster'
        required: true
        type: choice
        options:
          - ai-pod-1
          - ai-pod-2
          - ai-pod-3
          - ai-pod-4
      cni_type:
        description: 'CNI type to deploy (Cilium required for SAIF platform)'
        required: true
        type: choice
        options:
          - Cilium
          - OVN
        default: 'Cilium'

      # Stage toggles (all enabled by default for full deployment)
      validate:
        description: 'Run validation'
        type: boolean
        default: true
      deploy:
        description: 'Run deployment (blocked if cluster operational)'
        type: boolean
        default: true
      post_install:
        description: 'Run post-install (kubeconfig, IDMS, ArgoCD)'
        type: boolean
        default: true
      test:
        description: 'Run tests'
        type: boolean
        default: true
      force_deploy:
        description: 'Force deploy (bypass operational cluster safeguard)'
        type: boolean
        default: false

      request_id:
        description: 'Orchestrator correlation ID (for run tracking)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  validate:
    name: 'Validate'
    if: inputs.validate == true
    uses: ./.github/workflows/openshift-validate.yaml
    with:
      cluster_name: ${{ inputs.cluster_name }}
    secrets: inherit

  deploy:
    name: 'Deploy'
    needs: validate
    if: always() && inputs.deploy == true && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    uses: ./.github/workflows/openshift-deploy.yaml
    with:
      cluster_name: ${{ inputs.cluster_name }}
      action: 'DEPLOY'
      cni_type: ${{ inputs.cni_type }}
      force_deploy: ${{ inputs.force_deploy }}
    secrets: inherit

  post_install:
    name: 'Post-Install'
    needs: [validate, deploy]
    if: always() && inputs.post_install == true && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    uses: ./.github/workflows/openshift-post-install.yaml
    with:
      cluster_name: ${{ inputs.cluster_name }}
      apply_idms: true
      apply_argocd: true
    secrets: inherit

  test:
    name: 'Test'
    needs: [validate, deploy, post_install]
    if: always() && inputs.test == true && (needs.post_install.result == 'success' || needs.post_install.result == 'skipped')
    uses: ./.github/workflows/openshift-test.yaml
    with:
      cluster_name: ${{ inputs.cluster_name }}
    secrets: inherit

  summary:
    name: 'Pipeline Summary'
    needs: [validate, deploy, post_install, test]
    if: always()
    runs-on: [self-hosted, linux, saif-github-runner]
    steps:
    - name: Generate Summary
      run: |
        echo "## OpenShift Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Cluster:** ${{ inputs.cluster_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**CNI:** ${{ inputs.cni_type }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Stage | Enabled | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|---------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Validate | ${{ inputs.validate }} | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Deploy | ${{ inputs.deploy }} | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Post-Install | ${{ inputs.post_install }} | ${{ needs.post_install.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Test | ${{ inputs.test }} | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
