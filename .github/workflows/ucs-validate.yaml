name: 'Validate UCS'

# Validates UCS/Intersight prerequisites:
# - Intersight credentials exist
# - Server profile is valid

on:
  workflow_dispatch:
    inputs:
      server_profile:
        description: 'UCS Server Profile'
        required: true
        type: choice
        options:
          - saif-example-node-1
          - saif-example-node-2
          - saif-example-node-3
          - saif-example-node-4
  workflow_call:
    inputs:
      server_profile:
        type: string
        required: true


defaults:
  run:
    shell: bash

jobs:
  validate:
    name: 'Validate UCS Prerequisites'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    container:
      image: ${{ vars.RUNNER_CONTAINER_IMAGE }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Validate Server Profile Name
      env:
        SERVER_TARGET: ${{ inputs.server_profile }}
        OPERATION: Plan
        DOMAIN_STATE: Unchanged
      run: |
        python3 scripts/select-ucs-profiles.py

    - name: Validate Intersight Credentials
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Intersight Credentials" >> $GITHUB_STEP_SUMMARY
        VALIDATION_FAILED=0

        if [ -z "${{ secrets.INTERSIGHT_API_KEY_ID }}" ]; then
          echo "❌ INTERSIGHT_API_KEY_ID secret not set" >> $GITHUB_STEP_SUMMARY
          VALIDATION_FAILED=1
        else
          echo "✅ INTERSIGHT_API_KEY_ID exists" >> $GITHUB_STEP_SUMMARY
        fi

        if [ -z "${{ secrets.INTERSIGHT_SECRET_KEY }}" ]; then
          echo "❌ INTERSIGHT_SECRET_KEY secret not set" >> $GITHUB_STEP_SUMMARY
          VALIDATION_FAILED=1
        else
          echo "✅ INTERSIGHT_SECRET_KEY exists" >> $GITHUB_STEP_SUMMARY
        fi

        if [ $VALIDATION_FAILED -eq 1 ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**❌ Validation FAILED**" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Validation Summary
      if: always()
      run: |
        if [ "${{ job.status }}" != success ]; then
          echo "Validation failed or was cancelled; inspect prior steps." >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "**✅ UCS validation passed for profile: ${{ inputs.server_profile }}**" >> $GITHUB_STEP_SUMMARY
