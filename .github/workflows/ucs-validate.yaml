name: 'Validate UCS'

# Validates UCS/Intersight prerequisites:
# - Intersight credentials exist
# - Server profile is valid

on:
  workflow_dispatch:
    inputs:
      server_profile:
        description: 'UCS Server Profile'
        required: true
        type: choice
        options:
          - saif-ai-pod-1
          - saif-ai-pod-2
          - saif-ai-pod-3
          - saif-ai-pod-4
  workflow_call:
    inputs:
      server_profile:
        type: string
        required: true


jobs:
  validate:
    name: 'Validate UCS Prerequisites'
    runs-on: [self-hosted, linux, saif-github-runner]
    container:
      image: ghcr.io/mahowlin/github-actions-container:${{ vars.CONTAINER_TAG }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Validate Server Profile Name
      run: |
        echo "## UCS Validation" >> $GITHUB_STEP_SUMMARY
        PROFILE="${{ inputs.server_profile }}"

        # Validate profile name format
        if echo "$PROFILE" | grep -qE '^saif-ai-pod-[0-9]+$'; then
          echo "✅ Server profile: $PROFILE" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Invalid server profile format: $PROFILE" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Validate Intersight Credentials
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Intersight Credentials" >> $GITHUB_STEP_SUMMARY
        VALIDATION_FAILED=0

        if [ -z "${{ secrets.INTERSIGHT_API_KEY_ID }}" ]; then
          echo "❌ INTERSIGHT_API_KEY_ID secret not set" >> $GITHUB_STEP_SUMMARY
          VALIDATION_FAILED=1
        else
          echo "✅ INTERSIGHT_API_KEY_ID exists" >> $GITHUB_STEP_SUMMARY
        fi

        if [ -z "${{ secrets.INTERSIGHT_SECRET_KEY }}" ]; then
          echo "❌ INTERSIGHT_SECRET_KEY secret not set" >> $GITHUB_STEP_SUMMARY
          VALIDATION_FAILED=1
        else
          echo "✅ INTERSIGHT_SECRET_KEY exists" >> $GITHUB_STEP_SUMMARY
        fi

        if [ $VALIDATION_FAILED -eq 1 ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**❌ Validation FAILED**" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Validation Summary
      if: always()
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "**✅ UCS validation passed for profile: ${{ inputs.server_profile }}**" >> $GITHUB_STEP_SUMMARY
