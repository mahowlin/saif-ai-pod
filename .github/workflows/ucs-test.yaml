name: 'Test UCS Deployment'

# Tests UCS deployment after ucs/deploy.yaml completes:
# - Server profile is associated
# - Profile ConfigState is "Ok"
# - MAC address assigned
# - MAC addresses assigned in live Intersight vNICs

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'Cluster name (example-node-1, example-node-2, etc.)'
        required: true
        type: string
  workflow_call:
    inputs:
      cluster_name:
        type: string
        required: true


defaults:
  run:
    shell: bash

jobs:
  test:
    name: 'Test UCS Deployment'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    container:
      image: ${{ vars.RUNNER_CONTAINER_IMAGE }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Test Live MAC Address Assignment
      env:
        INTERSIGHT_API_KEY_ID: ${{ secrets.INTERSIGHT_API_KEY_ID }}
        INTERSIGHT_SECRET_KEY: ${{ secrets.INTERSIGHT_SECRET_KEY }}
      run: |
        echo "## Live MAC Address Validation" >> $GITHUB_STEP_SUMMARY
        VALIDATION_FAILED=0
        CLUSTER="${{ inputs.cluster_name }}"
        PROFILE="saif-${CLUSTER}"

        PROFILE_DATA=$(isctl get server profile --filter "Name eq '$PROFILE'" -o json)
        PROFILE_MOID=$(echo "$PROFILE_DATA" | jq -r '.[0].Moid // empty')
        if [ -z "$PROFILE_MOID" ]; then
          echo "❌ Server profile not found: $PROFILE" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        for IFACE in eth0 eth1; do
          MAC=$(isctl get vnic ethif --filter "Profile.Moid eq '$PROFILE_MOID' and Name eq '$IFACE'" -o json | jq -r '.[0].MacAddress // ""')
          if [ -z "$MAC" ]; then
            echo "❌ $PROFILE $IFACE MAC not assigned" >> $GITHUB_STEP_SUMMARY
            VALIDATION_FAILED=1
          else
            echo "✅ $PROFILE $IFACE: $MAC" >> $GITHUB_STEP_SUMMARY
          fi
        done

        if [ $VALIDATION_FAILED -eq 1 ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**❌ Live MAC address validation FAILED**" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Test Summary
      if: always()
      run: |
        if [ "${{ job.status }}" != success ]; then
          echo "Validation failed or was cancelled; inspect prior steps." >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "**✅ UCS deployment test passed**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Server profile is associated and MAC address is assigned." >> $GITHUB_STEP_SUMMARY
