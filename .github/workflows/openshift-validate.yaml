name: 'Validate OpenShift'

# Validates OpenShift data model and pre-checks:
# - cluster-macs.yaml and rendered configs
# - GitHub secrets, DNS, registry, web server

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'Target cluster'
        required: true
        type: choice
        options:
          - ai-pod-1
          - ai-pod-2
          - ai-pod-3
          - ai-pod-4
  workflow_call:
    inputs:
      cluster_name:
        type: string
        required: true


jobs:
  validate:
    name: 'Validate OpenShift Data Model'
    runs-on: [self-hosted, linux, saif-github-runner]
    container:
      image: ghcr.io/mahowlin/github-actions-container:${{ vars.CONTAINER_TAG }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Validate Data Model
      run: |
        echo "## Data Model Validation" >> $GITHUB_STEP_SUMMARY
        VALIDATION_FAILED=0
        CLUSTER="${{ inputs.cluster_name }}"

        # Check ucs-state.yaml exists (required for actual deployment)
        if [ ! -f "ucs-state.yaml" ]; then
          echo "⚠️  ucs-state.yaml not found (required for DEPLOY)" >> $GITHUB_STEP_SUMMARY
          echo "   Run: gh workflow run ucs-pipeline.yaml" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ ucs-state.yaml exists" >> $GITHUB_STEP_SUMMARY

          # Get UCS profile from cluster-mappings
          UCS_PROFILE=$(yq -r ".clusters[] | select(.name == \"$CLUSTER\") | .ucs_profile" openshift/cluster-mappings.yaml)
          INTERFACE=$(yq -r ".clusters[] | select(.name == \"$CLUSTER\") | .interface" openshift/cluster-mappings.yaml)

          # Find profile in any chassis
          CHASSIS_LIST=$(yq -r '.chassis | keys | .[]' ucs-state.yaml)
          MAC_FOUND=false

          for CHASSIS in $CHASSIS_LIST; do
            # Note: Keys with dashes must be quoted for Python yq (interprets dashes as subtraction)
            if yq -e ".chassis.\"$CHASSIS\".servers.\"$UCS_PROFILE\"" ucs-state.yaml > /dev/null 2>&1; then
              # For bond interfaces, check both member MACs (eth0 and eth1)
              # For single interfaces, check just that interface
              if [ "$INTERFACE" = "bond0" ]; then
                MAC_ETH0=$(yq -r ".chassis.\"$CHASSIS\".servers.\"$UCS_PROFILE\".mac_eth0" ucs-state.yaml)
                MAC_ETH1=$(yq -r ".chassis.\"$CHASSIS\".servers.\"$UCS_PROFILE\".mac_eth1" ucs-state.yaml)
                if [ "$MAC_ETH0" != "null" ] && [ -n "$MAC_ETH0" ] && [ "$MAC_ETH1" != "null" ] && [ -n "$MAC_ETH1" ]; then
                  SERIAL=$(yq -r ".chassis.\"$CHASSIS\".servers.\"$UCS_PROFILE\".serial" ucs-state.yaml)
                  SLOT=$(yq -r ".chassis.\"$CHASSIS\".servers.\"$UCS_PROFILE\".slot" ucs-state.yaml)
                  echo "✅ MAC addresses for $INTERFACE: eth0=$MAC_ETH0, eth1=$MAC_ETH1" >> $GITHUB_STEP_SUMMARY
                  echo "   Profile: $UCS_PROFILE (serial: $SERIAL, slot: $SLOT, chassis: $CHASSIS)" >> $GITHUB_STEP_SUMMARY
                  MAC_FOUND=true
                  break
                fi
              else
                MAC=$(yq -r ".chassis.\"$CHASSIS\".servers.\"$UCS_PROFILE\".mac_${INTERFACE}" ucs-state.yaml)
                if [ "$MAC" != "null" ] && [ -n "$MAC" ]; then
                  SERIAL=$(yq -r ".chassis.\"$CHASSIS\".servers.\"$UCS_PROFILE\".serial" ucs-state.yaml)
                  SLOT=$(yq -r ".chassis.\"$CHASSIS\".servers.\"$UCS_PROFILE\".slot" ucs-state.yaml)
                  echo "✅ MAC address ($INTERFACE): $MAC" >> $GITHUB_STEP_SUMMARY
                  echo "   Profile: $UCS_PROFILE (serial: $SERIAL, slot: $SLOT, chassis: $CHASSIS)" >> $GITHUB_STEP_SUMMARY
                  MAC_FOUND=true
                  break
                fi
              fi
            fi
          done

          if [ "$MAC_FOUND" = false ]; then
            echo "⚠️  MAC address not found for profile $UCS_PROFILE interface $INTERFACE (required for DEPLOY)" >> $GITHUB_STEP_SUMMARY
          fi

          # Validate NVMe serials exist for mdadm storage configuration (REQUIRED)
          NVME_FOUND=false
          for CHASSIS in $CHASSIS_LIST; do
            if yq -e ".chassis.\"$CHASSIS\".servers.\"$UCS_PROFILE\"" ucs-state.yaml > /dev/null 2>&1; then
              NVME_COUNT=$(yq -r ".chassis.\"$CHASSIS\".servers.\"$UCS_PROFILE\".nvme_serials | length // 0" ucs-state.yaml)
              if [ "$NVME_COUNT" -eq 5 ]; then
                echo "✅ NVMe serials: $NVME_COUNT drives (for mdadm RAID10)" >> $GITHUB_STEP_SUMMARY
                NVME_FOUND=true
              elif [ "$NVME_COUNT" -gt 0 ]; then
                echo "❌ NVMe serials: $NVME_COUNT drives (expected 5 for RAID10)" >> $GITHUB_STEP_SUMMARY
                VALIDATION_FAILED=1
              else
                echo "❌ NVMe serials: not found in ucs-state.yaml" >> $GITHUB_STEP_SUMMARY
                echo "   Run UCS pipeline to discover: gh workflow run ucs-pipeline.yaml -f operation='Activate - Apply config to server' -f server_target=$UCS_PROFILE" >> $GITHUB_STEP_SUMMARY
                VALIDATION_FAILED=1
              fi
              break
            fi
          done
          if [ "$NVME_FOUND" = false ] && [ $VALIDATION_FAILED -eq 0 ]; then
            echo "❌ NVMe serials: server profile $UCS_PROFILE not found in ucs-state.yaml" >> $GITHUB_STEP_SUMMARY
            VALIDATION_FAILED=1
          fi
        fi

        # Note: Rendered configs are validated at deployment time
        # The deploy workflow renders configs with secrets injected
        # Pre-rendered configs in git are optional for review only
        echo "ℹ️  Config rendering will be validated during deployment" >> $GITHUB_STEP_SUMMARY

        if [ $VALIDATION_FAILED -eq 1 ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**❌ Data model validation FAILED**" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Validate GitHub Secrets
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Pre-checks: Secrets" >> $GITHUB_STEP_SUMMARY
        VALIDATION_FAILED=0

        if [ -z "${{ secrets.REDHAT_PULL_SECRET }}" ]; then
          echo "❌ REDHAT_PULL_SECRET not set" >> $GITHUB_STEP_SUMMARY
          VALIDATION_FAILED=1
        else
          # Validate it's JSON with auths key
          if echo '${{ secrets.REDHAT_PULL_SECRET }}' | jq -e '.auths' > /dev/null 2>&1; then
            AUTH_COUNT=$(echo '${{ secrets.REDHAT_PULL_SECRET }}' | jq '.auths | keys | length')
            echo "✅ REDHAT_PULL_SECRET exists (valid JSON, ${AUTH_COUNT} registries)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ REDHAT_PULL_SECRET exists but may not be valid format" >> $GITHUB_STEP_SUMMARY
          fi
        fi

        if [ -z "${{ secrets.SSH_PUBLIC_KEY }}" ]; then
          echo "❌ SSH_PUBLIC_KEY not set" >> $GITHUB_STEP_SUMMARY
          VALIDATION_FAILED=1
        else
          # Validate it's an SSH public key
          if echo "${{ secrets.SSH_PUBLIC_KEY }}" | grep -qE "^ssh-(rsa|ed25519|ecdsa)"; then
            KEY_TYPE=$(echo "${{ secrets.SSH_PUBLIC_KEY }}" | awk '{print $1}')
            echo "✅ SSH_PUBLIC_KEY exists (${KEY_TYPE})" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ SSH_PUBLIC_KEY exists but may not be valid format" >> $GITHUB_STEP_SUMMARY
          fi
        fi

        if [ -z "${{ secrets.REGISTRY_CA_CERT }}" ]; then
          echo "❌ REGISTRY_CA_CERT not set (required for registry TLS)" >> $GITHUB_STEP_SUMMARY
          VALIDATION_FAILED=1
        else
          # Validate it's a PEM certificate
          if echo "${{ secrets.REGISTRY_CA_CERT }}" | grep -q "BEGIN CERTIFICATE"; then
            CERT_CHARS=$(echo "${{ secrets.REGISTRY_CA_CERT }}" | wc -c)
            echo "✅ REGISTRY_CA_CERT exists (valid PEM, ${CERT_CHARS} chars)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ REGISTRY_CA_CERT exists but may not be valid PEM format" >> $GITHUB_STEP_SUMMARY
          fi
        fi

        if [ $VALIDATION_FAILED -eq 1 ]; then
          exit 1
        fi

    - name: Validate Infrastructure
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Pre-checks: Infrastructure" >> $GITHUB_STEP_SUMMARY
        VALIDATION_FAILED=0
        CLUSTER="${{ inputs.cluster_name }}"

        # Load config
        BASE_DOMAIN=$(yq -r ".infrastructure.base_domain" openshift/cluster-mappings.yaml)
        REGISTRY_HOST=$(yq -r ".infrastructure.registry.hostname" openshift/cluster-mappings.yaml)
        REGISTRY_PORT=$(yq -r ".infrastructure.registry.port" openshift/cluster-mappings.yaml)

        # Check DNS resolution
        if getent hosts api.$CLUSTER.$BASE_DOMAIN > /dev/null 2>&1; then
          RESOLVED_IP=$(getent hosts api.$CLUSTER.$BASE_DOMAIN | awk '{print $1}')
          echo "✅ DNS: api.$CLUSTER.$BASE_DOMAIN → $RESOLVED_IP" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ DNS: api.$CLUSTER.$BASE_DOMAIN does NOT resolve" >> $GITHUB_STEP_SUMMARY
          VALIDATION_FAILED=1
        fi

        # Check registry accessible (uses HTTPS with self-signed cert)
        REGISTRY_URL="https://$REGISTRY_HOST:$REGISTRY_PORT"
        if curl -skf "$REGISTRY_URL/v2/" > /dev/null 2>&1; then
          echo "✅ Registry accessible at $REGISTRY_URL" >> $GITHUB_STEP_SUMMARY

          # Check for required images (warning only - Phase 4 handles mirroring)
          if curl -skf "$REGISTRY_URL/v2/openshift/release-images/tags/list" > /dev/null 2>&1; then
            echo "✅ Required images exist (openshift/release-images)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  Required images NOT found (openshift/release-images)" >> $GITHUB_STEP_SUMMARY
            echo "   Run: gh workflow run sync-images.yaml -f dry_run=false" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "❌ Registry NOT accessible at $REGISTRY_URL" >> $GITHUB_STEP_SUMMARY
          VALIDATION_FAILED=1
        fi

        # Check web server accessible (for ISO hosting)
        WEB_URL="${{ vars.OCP_ISO_SERVER_URL }}"
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_URL/" 2>/dev/null || echo "000")
        if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "403" ]; then
          echo "✅ Web server accessible at $WEB_URL (HTTP $HTTP_CODE)" >> $GITHUB_STEP_SUMMARY
        elif [ "$HTTP_CODE" = "401" ]; then
          echo "✅ Web server accessible at $WEB_URL (requires auth)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Web server NOT accessible at $WEB_URL (HTTP $HTTP_CODE)" >> $GITHUB_STEP_SUMMARY
          VALIDATION_FAILED=1
        fi

        if [ $VALIDATION_FAILED -eq 1 ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**❌ Infrastructure pre-checks FAILED**" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Validate HTTP Server Authentication
      env:
        HTTP_USER: ${{ secrets.HTTP_SERVER_USER }}
        HTTP_PASS: ${{ secrets.HTTP_SERVER_PASSWORD }}
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Pre-checks: HTTP Authentication" >> $GITHUB_STEP_SUMMARY

        # Check secrets exist
        if [ -z "$HTTP_USER" ] || [ -z "$HTTP_PASS" ]; then
          echo "❌ HTTP_SERVER_USER or HTTP_SERVER_PASSWORD not set" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        # Test authentication actually works
        WEB_URL="${{ vars.OCP_ISO_SERVER_URL }}"
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -u "${HTTP_USER}:${HTTP_PASS}" "$WEB_URL/" 2>/dev/null || echo "000")

        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ HTTP authentication successful" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ HTTP authentication FAILED (HTTP $HTTP_CODE)" >> $GITHUB_STEP_SUMMARY
          echo "   Check HTTP_SERVER_PASSWORD matches htpasswd on runner VM" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Validation Summary
      if: success()
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "**✅ OpenShift validation passed for cluster: ${{ inputs.cluster_name }}**" >> $GITHUB_STEP_SUMMARY
