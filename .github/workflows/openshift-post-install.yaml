name: 'Post-Install Configuration'

# Day 1 Post-Install: Minimal bootstrap configuration
#
# Applies ONLY what's needed to hand off to Day 2 GitOps:
# - Bootstrap IDMS (minimal mirrors for ArgoCD installation)
# - Sealed Secrets controller (for GitOps-managed secrets)
# - ArgoCD GitOps operator + app-of-apps
#
# Day 2 GitOps (ArgoCD) manages everything else:
# - Full IDMS (platform-idms Application)
# - All operators and workloads
# - All configuration
#
# This workflow is separated from openshift-deploy.yaml to allow:
# - Re-running post-install steps without full ISO regeneration
# - Fast iteration when debugging ArgoCD bootstrap issues

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'Target cluster (e.g. example-node-1, example-management)'
        required: true
        type: string
      cluster_dir:
        description: 'Absolute private prepared/enriched cluster directory (separate from raw target)'
        type: string
        required: true
      artifact_manifest:
        description: 'Absolute pristine GeneratedArtifactManifest path (required for connected mode)'
        type: string
        required: false
      raw_target_root:
        description: 'Absolute pristine generated compute root containing data/ (connected mode)'
        type: string
        required: false
      gitops_target_root:
        description: 'Absolute clean customer GitOps checkout at declared origin/revision'
        type: string
        required: true
      apply_idms:
        description: 'Download and apply latest IDMS from sync-images'
        required: false
        type: boolean
        default: true
      apply_argocd:
        description: 'Bootstrap ArgoCD GitOps'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      cluster_name:
        type: string
        required: true
      cluster_dir:
        description: 'Absolute private prepared/enriched cluster directory (separate from raw target)'
        type: string
        required: true
      artifact_manifest:
        description: 'Absolute pristine GeneratedArtifactManifest path (required for connected mode)'
        type: string
        required: false
      raw_target_root:
        description: 'Absolute pristine generated compute root containing data/ (connected mode)'
        type: string
        required: false
      gitops_target_root:
        description: 'Absolute clean customer GitOps checkout at declared origin/revision'
        type: string
        required: true
      apply_idms:
        type: boolean
        required: false
        default: true
      apply_argocd:
        type: boolean
        required: false
        default: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  configure:
    name: 'Apply Post-Install Configuration'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    container:
      image: ${{ vars.RUNNER_CONTAINER_IMAGE }}

    env:
      CLUSTER: ${{ inputs.cluster_name }}
      CLUSTER_DIR: ${{ inputs.cluster_dir }}
      ARTIFACT_MANIFEST: ${{ inputs.artifact_manifest }}
      RAW_TARGET_ROOT: ${{ inputs.raw_target_root }}
      GITOPS_TARGET_ROOT: ${{ inputs.gitops_target_root }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Consume the previously prepared private tree; never re-enrich pristine inputs here.
    - name: Validate Selected Cluster Contract
      env:
        GITOPS_BOOTSTRAP_DIR: ${{ runner.temp }}/gitops-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
      shell: bash
      run: |
        set -euo pipefail
        [[ "$CLUSTER_DIR" = /* && "$GITOPS_TARGET_ROOT" = /* ]] || { echo "::error::cluster_dir and gitops_target_root must be absolute prepared runner paths"; exit 1; }
        [[ "${CLUSTER_DIR##*/}" = "$CLUSTER" ]] || { echo "::error::cluster_dir basename must match cluster_name"; exit 1; }
        args=(--cluster-dir "$CLUSTER_DIR" --action post-install --gitops-target-root "$GITOPS_TARGET_ROOT")
        if [[ -n "$ARTIFACT_MANIFEST" || -n "$RAW_TARGET_ROOT" ]]; then
          [[ "$ARTIFACT_MANIFEST" = /* && "$RAW_TARGET_ROOT" = /* ]] || { echo "::error::artifact_manifest and raw_target_root must both be absolute paths"; exit 1; }
          args+=(--artifact-manifest "$ARTIFACT_MANIFEST" --raw-target-root "$RAW_TARGET_ROOT")
        fi
        python3 scripts/validate-selected-cluster-contract.py "${args[@]}" --gitops-output-dir "$GITOPS_BOOTSTRAP_DIR"
        cat "$GITOPS_BOOTSTRAP_DIR/selection.env" >> "$GITHUB_ENV"
        printf 'GITOPS_BOOTSTRAP_DIR=%s\n' "$GITOPS_BOOTSTRAP_DIR" >> "$GITHUB_ENV"
        echo "Selected cluster and customer GitOps root validated" >> "$GITHUB_STEP_SUMMARY"

    - name: Retrieve Kubeconfig
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        echo "## Post-Install Configuration" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Cluster:** $CLUSTER" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Always retrieve fresh kubeconfig via SSH
        # This ensures we get the current cluster's certificates (not stale from repo)
        if [ -z "$SSH_PRIVATE_KEY" ]; then
          echo "::error::SSH_PRIVATE_KEY secret not configured"
          exit 1
        fi

        # Get cluster IP and base domain from SAIF-generated artifacts
        CLUSTER_IP=$(yq -r '.rendezvousIP' "$CLUSTER_DIR/agent-config.yaml")
        BASE_DOMAIN=$(yq -r '.baseDomain' "$CLUSTER_DIR/install-config.yaml")

        if [ -z "$CLUSTER_IP" ] || [ "$CLUSTER_IP" = "null" ]; then
          echo "::error::Cannot find IP for cluster $CLUSTER"
          exit 1
        fi

        # SSH to cluster and retrieve the first usable ABI kubeconfig.
        # Compact bootstrap exposes /opt/openshift/auth/kubeconfig early; SNO may only
        # have localhost-recovery.kubeconfig once fully installed.
        umask 077
        POST_PRIVATE_DIR=$(mktemp -d "$RUNNER_TEMP/post-install.XXXXXX")
        echo "POST_PRIVATE_DIR=$POST_PRIVATE_DIR" >> "$GITHUB_ENV"
        SSH_KEY_FILE="$POST_PRIVATE_DIR/ssh-key"
        trap 'rm -f -- "$SSH_KEY_FILE"' EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"

        KUBECONFIG_CANDIDATES="/opt/openshift/auth/kubeconfig /var/opt/openshift/auth/kubeconfig /etc/kubernetes/static-pod-resources/kube-apiserver-certs/secrets/node-kubeconfigs/localhost-recovery.kubeconfig /etc/kubernetes/kubeconfig"
        KUBECONFIG_FILE="$POST_PRIVATE_DIR/kubeconfig"

        echo "Retrieving kubeconfig via SSH to core@$CLUSTER_IP..."
        SELECTED_KUBECONFIG=$(ssh -i "$SSH_KEY_FILE" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 \
          core@$CLUSTER_IP "for p in $KUBECONFIG_CANDIDATES; do if sudo test -s \"\$p\" && sudo KUBECONFIG=\"\$p\" oc get --raw=/version >/dev/null 2>&1; then echo \"\$p\"; exit 0; fi; done" 2>/dev/null || true)

        if [ -z "$SELECTED_KUBECONFIG" ]; then
          echo "::error::Failed to find a usable kubeconfig on cluster via SSH"
          echo "❌ No usable kubeconfig found on core@$CLUSTER_IP" >> $GITHUB_STEP_SUMMARY
          rm -f "$SSH_KEY_FILE"
          exit 1
        fi

        if ssh -i "$SSH_KEY_FILE" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 \
          core@$CLUSTER_IP "sudo cat $SELECTED_KUBECONFIG" > "$KUBECONFIG_FILE" 2>/dev/null; then

          if [ -s "$KUBECONFIG_FILE" ]; then
            # Update server URL to use cluster API endpoint (not localhost)
            sed -i "s|server: https://localhost:6443|server: https://api.$CLUSTER.$BASE_DOMAIN:6443|g" "$KUBECONFIG_FILE"
            sed -i "s|server: https://127.0.0.1:6443|server: https://api.$CLUSTER.$BASE_DOMAIN:6443|g" "$KUBECONFIG_FILE"

            echo "✅ Kubeconfig retrieved via SSH from $SELECTED_KUBECONFIG" >> $GITHUB_STEP_SUMMARY
            echo "KUBECONFIG=$KUBECONFIG_FILE" >> $GITHUB_ENV
          else
            rm -f "$SSH_KEY_FILE"
            echo "::error::Retrieved kubeconfig is empty"
            exit 1
          fi
        else
          echo "::error::Failed to retrieve kubeconfig from cluster via SSH"
          echo "❌ SSH to cluster failed - is the cluster operational?" >> $GITHUB_STEP_SUMMARY
          rm -f "$SSH_KEY_FILE"
          exit 1
        fi

        rm -f "$SSH_KEY_FILE"

    - name: Verify Cluster Access
      shell: bash
      run: |
        echo "Verifying cluster access..."

        # Use oc get nodes as connectivity check (more reliable than oc cluster-info)
        if ! oc get nodes --no-headers &>/dev/null; then
          echo "::error::Cannot connect to cluster API"
          echo "❌ Cannot connect to cluster API" >> $GITHUB_STEP_SUMMARY
          echo "Kubeconfig: $KUBECONFIG" >> $GITHUB_STEP_SUMMARY
          oc cluster-info 2>&1 || true
          exit 1
        fi

        # Get cluster info
        OCP_VERSION=$(oc get clusterversion version -o jsonpath='{.status.desired.version}' 2>/dev/null || echo "unknown")
        NODE_COUNT=$(oc get nodes --no-headers 2>/dev/null | wc -l | tr -d '[:space:]')

        echo "✅ Connected to cluster" >> $GITHUB_STEP_SUMMARY
        echo "- **OpenShift Version:** $OCP_VERSION" >> $GITHUB_STEP_SUMMARY
        echo "- **Nodes:** $NODE_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Commit Kubeconfig to Repo
      env:
        KUBECONFIG_REPO_TOKEN: ${{ secrets.KUBECONFIG_REPO_TOKEN }}
      run: |
        set -euo pipefail
        echo "### Kubeconfig Commit" >> $GITHUB_STEP_SUMMARY

        if [ -z "$KUBECONFIG_REPO_TOKEN" ]; then
          echo "⚠️ KUBECONFIG_REPO_TOKEN not configured - skipping commit" >> $GITHUB_STEP_SUMMARY
          exit 0
        fi

        [[ "$CLUSTER" =~ ^[a-z0-9][a-z0-9-]*$ ]] || exit 1
        # Optional private destination is explicit execution input.
        KUBECONFIG_REPOSITORY="${{ vars.KUBECONFIG_REPOSITORY }}"
        KUBECONFIG_REF="${{ vars.KUBECONFIG_REF }}"
        [[ "$KUBECONFIG_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] && test -n "$KUBECONFIG_REF" || exit 1
        umask 077
        KUBECONFIG_WRITE_DIR=$(mktemp -d "$RUNNER_TEMP/kubeconfig-write.XXXXXX")
        trap 'rm -rf -- "$KUBECONFIG_WRITE_DIR"' EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$KUBECONFIG_REPO_TOKEN" | base64 | tr -d '\n')"
        git clone --depth 1 --branch "$KUBECONFIG_REF" \
          "https://github.com/$KUBECONFIG_REPOSITORY.git" "$KUBECONFIG_WRITE_DIR/repository"

        # Copy fresh kubeconfig to repo
        mkdir -p "$KUBECONFIG_WRITE_DIR/repository/clusters/${CLUSTER}"
        cp "$KUBECONFIG" "$KUBECONFIG_WRITE_DIR/repository/clusters/${CLUSTER}/kubeconfig"

        cd "$KUBECONFIG_WRITE_DIR/repository"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "clusters/${CLUSTER}/kubeconfig"

        if ! git diff --staged --quiet; then
          git commit -m "Update kubeconfig for ${CLUSTER} (run ${{ github.run_id }})"

          # Retry push with rebase if race condition occurs
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            if git push; then
              echo "✅ Kubeconfig committed to repo" >> $GITHUB_STEP_SUMMARY
              break
            else
              if [ $i -lt $MAX_RETRIES ]; then
                echo "Push failed (attempt $i/$MAX_RETRIES), rebasing and retrying..."
                git pull --rebase
              else
                echo "❌ Failed to push after $MAX_RETRIES attempts" >> $GITHUB_STEP_SUMMARY
                exit 1
              fi
            fi
          done
        else
          echo "ℹ️ Kubeconfig unchanged" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Verify IDMS Configuration
      run: |
        echo "### IDMS Status" >> $GITHUB_STEP_SUMMARY

        # Check for existing IDMS resources
        IDMS_COUNT=$(oc get imagedigestmirrorset --no-headers 2>/dev/null | wc -l | tr -d '[:space:]')
        IDMS_COUNT="${IDMS_COUNT:-0}"
        ITMS_COUNT=$(oc get imagetagmirrorset --no-headers 2>/dev/null | wc -l | tr -d '[:space:]')
        ITMS_COUNT="${ITMS_COUNT:-0}"

        if [ "$IDMS_COUNT" -gt 0 ] || [ "$ITMS_COUNT" -gt 0 ]; then
          echo "✅ Found $IDMS_COUNT IDMS and $ITMS_COUNT ITMS configurations" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**ImageDigestMirrorSets:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          oc get imagedigestmirrorset 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "None" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**ImageTagMirrorSets:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          oc get imagetagmirrorset 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "None" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ No IDMS/ITMS found - operators may fail to pull images" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Apply Bootstrap IDMS
      if: inputs.apply_idms == true
      run: |
        echo "### IDMS Application (Day 1 Bootstrap)" >> $GITHUB_STEP_SUMMARY

        # Apply selected GitOps bootstrap image-policy bundle from the rendered cluster folder.
        # Full Day 2 IDMS is managed via GitOps (platform-idms ArgoCD Application).
        DATA_DIR="$CLUSTER_DIR"
        BUNDLE_REF=$(yq -r '.imagePolicyBundles.gitopsBootstrap // ""' "$DATA_DIR/metadata.yaml")
        DELIVERY_MODE=$(yq -r '.imageDelivery.mode' "$DATA_DIR/metadata.yaml")
        if [ "$DELIVERY_MODE" = "connected" ]; then
          echo "Connected delivery: no bootstrap mirror policy selected" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if [ -z "$BUNDLE_REF" ] || [ "$BUNDLE_REF" = "null" ]; then
          echo "❌ Missing metadata imagePolicyBundles.gitopsBootstrap" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        if [ "$BUNDLE_REF" = "gitops-bootstrap" ]; then
          BUNDLE_DIR="$DATA_DIR/image-policy-bundles/gitops-bootstrap"
        elif [[ "$BUNDLE_REF" = /* ]]; then
          BUNDLE_DIR="$BUNDLE_REF"
        else
          BUNDLE_DIR="$DATA_DIR/$BUNDLE_REF"
        fi
        echo "Applying selected gitops-bootstrap image-policy bundle from $BUNDLE_DIR..."
        oc apply -f "$BUNDLE_DIR/manifests/"

        echo "✅ Applied selected gitops-bootstrap image-policy bundle" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Note:** Full IDMS is managed via GitOps (platform-idms Application)." >> $GITHUB_STEP_SUMMARY
        echo "ArgoCD will sync complete IDMS after bootstrap." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Inject Sealed Secrets Key
      env:
        SEALED_SECRETS_CERT: ${{ secrets.SEALED_SECRETS_CERT }}
        SEALED_SECRETS_KEY: ${{ secrets.SEALED_SECRETS_KEY }}
      run: |
        echo "### Sealed Secrets Key Injection" >> $GITHUB_STEP_SUMMARY

        if [ -z "$SEALED_SECRETS_CERT" ] || [ -z "$SEALED_SECRETS_KEY" ]; then
          echo "⚠️ SEALED_SECRETS_CERT/KEY not configured - skipping" >> $GITHUB_STEP_SUMMARY
          echo "   Run sealed-secrets-key-bootstrap.yaml manually after ArgoCD syncs" >> $GITHUB_STEP_SUMMARY
          exit 0
        fi

        # Create namespace (idempotent)
        echo "Creating sealed-secrets namespace..."
        oc apply -f manifests/sealed-secrets/00-namespace.yaml

        # Inject shared key (envsubst replaces base64-encoded cert/key)
        echo "Injecting shared sealed-secrets key..."
        envsubst < manifests/sealed-secrets/04-shared-key.yaml | oc apply -f -

        echo "✅ Sealed Secrets key injected" >> $GITHUB_STEP_SUMMARY
        echo "   Controller will use this key when deployed by ArgoCD" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Bootstrap ArgoCD GitOps
      if: inputs.apply_argocd == true
      shell: bash
      env:
        ARGO_GIT_TOKEN: ${{ secrets.ARGO_GIT_TOKEN }}
      run: |
        set -euo pipefail
        echo "### ArgoCD Bootstrap" >> $GITHUB_STEP_SUMMARY
        # All selection variables and subscription.yaml were validated before credentials/API.
        export GITOPS_REPO_URL GITOPS_TARGET_REVISION GITOPS_ROOT

        # Check if ArgoCD is already installed
        if oc get argocd openshift-gitops -n openshift-gitops &>/dev/null; then
          echo "ArgoCD already installed, checking app-of-apps..."

          # Check if saif-apps exists and points to correct path
          CURRENT_PATH=$(oc get application saif-apps -n openshift-gitops -o jsonpath='{.spec.source.path}' 2>/dev/null || echo "")
          EXPECTED_PATH="$GITOPS_ROOT"

          CURRENT_REPO=$(oc get application saif-apps -n openshift-gitops -o jsonpath='{.spec.source.repoURL}' 2>/dev/null || true)
          CURRENT_REVISION=$(oc get application saif-apps -n openshift-gitops -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)
          if [ "$CURRENT_PATH" = "$EXPECTED_PATH" ] && [ "$CURRENT_REPO" = "$GITOPS_REPO_URL" ] && [ "$CURRENT_REVISION" = "$GITOPS_TARGET_REVISION" ]; then
            echo "✅ ArgoCD configured correctly for ${CLUSTER}" >> $GITHUB_STEP_SUMMARY

            # Update credentials in case they changed
            echo "Updating GitHub credentials..."
            envsubst < manifests/argocd/02-github-repo-secret.yaml | oc apply -f -
            echo "✅ GitHub credentials updated" >> $GITHUB_STEP_SUMMARY

            # Ensure TLS trust is configured (idempotent)
            if [ "$GITOPS_REGISTRY_TRUST_POLICY" = "additional-ca" ]; then
              oc get cm user-ca-bundle -n openshift-config -o jsonpath='{.data.ca-bundle\.crt}' > "$GITOPS_BOOTSTRAP_DIR/registry-ca.crt"
              oc create configmap argocd-tls-certs-cm -n openshift-gitops \
                --from-file="$GITOPS_REGISTRY_HOST=$GITOPS_BOOTSTRAP_DIR/registry-ca.crt" \
                --dry-run=client -o yaml | oc apply -f -
              echo "✅ ArgoCD TLS trust ensured" >> $GITHUB_STEP_SUMMARY
            fi
            exit 0
          else
            echo "Updating app-of-apps path from '$CURRENT_PATH' to '$EXPECTED_PATH'..."
          fi
        fi

        # Step 1: Install OpenShift GitOps Operator (if not present)
        if ! oc get csv -n "$GITOPS_OPERATOR_NAMESPACE" 2>/dev/null | grep -q "${GITOPS_OPERATOR_NAME}.*Succeeded"; then
          # Check if subscription exists in failed state - clean up first for idempotency
          SUB_STATUS=$(oc get subscription "$GITOPS_OPERATOR_NAME" -n "$GITOPS_OPERATOR_NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="BundleUnpackFailed")].status}' 2>/dev/null || echo "")
          if [ "$SUB_STATUS" = "True" ]; then
            echo "Found failed subscription, cleaning up for retry..."
            oc delete subscription "$GITOPS_OPERATOR_NAME" -n "$GITOPS_OPERATOR_NAMESPACE" 2>/dev/null || true
            # Refresh catalog pod to pick up IDMS changes
            oc delete pod -n "$GITOPS_OPERATOR_SOURCE_NAMESPACE" -l "olm.catalogSource=$GITOPS_OPERATOR_SOURCE" 2>/dev/null || true
            echo "Waiting for catalog pod to restart..."
            sleep 30
          fi

          oc get catalogsource "$GITOPS_OPERATOR_SOURCE" -n "$GITOPS_OPERATOR_SOURCE_NAMESPACE" >/dev/null
          echo "Installing OpenShift GitOps operator from selected catalog..."
          oc apply -f "$GITOPS_BOOTSTRAP_DIR/subscription.yaml"
          if [ "$GITOPS_OPERATOR_APPROVAL" = "Manual" ]; then
            echo "Selected Manual InstallPlan approval: an authorized operator must review/approve it, then rerun post-install." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Wait for operator
          echo "Waiting for operator installation..."
          for i in {1..30}; do
            if oc get csv -n "$GITOPS_OPERATOR_NAMESPACE" 2>/dev/null | grep -q "${GITOPS_OPERATOR_NAME}.*Succeeded"; then
              echo "✅ Operator installed" >> $GITHUB_STEP_SUMMARY
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Operator installation timeout" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
            echo "Waiting for operator... ($i/30)"
            sleep 10
          done
        else
          echo "✅ Operator already installed" >> $GITHUB_STEP_SUMMARY
        fi

        # Step 2: Wait for ArgoCD instance
        echo "Waiting for ArgoCD instance..."
        for i in {1..30}; do
          if oc get argocd openshift-gitops -n openshift-gitops &>/dev/null; then
            echo "✅ ArgoCD instance ready" >> $GITHUB_STEP_SUMMARY
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "❌ ArgoCD instance timeout" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "Waiting for ArgoCD... ($i/30)"
          sleep 10
        done

        # Step 3: Configure GitHub credentials for ArgoCD
        echo "Configuring GitHub credentials..."
        envsubst < manifests/argocd/02-github-repo-secret.yaml | oc apply -f -
        echo "✅ GitHub credentials configured" >> $GITHUB_STEP_SUMMARY

        # Step 4: Grant controller cluster-admin
        echo "Configuring ArgoCD RBAC..."
        oc apply -f manifests/argocd/04-controller-rbac.yaml
        echo "✅ ArgoCD controller granted cluster-admin" >> $GITHUB_STEP_SUMMARY

        # Step 5: Configure ArgoCD TLS trust for OCI registry
        # The registry CA is already in user-ca-bundle (from install-config additionalTrustBundle)
        # ArgoCD needs this to pull Helm charts from the OCI registry
        echo "Configuring ArgoCD TLS trust for OCI registry..."
        if [ "$GITOPS_REGISTRY_TRUST_POLICY" = "additional-ca" ]; then
          oc get cm user-ca-bundle -n openshift-config -o jsonpath='{.data.ca-bundle\.crt}' > "$GITOPS_BOOTSTRAP_DIR/registry-ca.crt"
          oc create configmap argocd-tls-certs-cm -n openshift-gitops \
            --from-file="$GITOPS_REGISTRY_HOST=$GITOPS_BOOTSTRAP_DIR/registry-ca.crt" \
            --dry-run=client -o yaml | oc apply -f -
          echo "✅ ArgoCD TLS trust configured for OCI registry" >> $GITHUB_STEP_SUMMARY
        else
          echo "No additional registry CA selected; retaining normal system trust" >> $GITHUB_STEP_SUMMARY
        fi

        # Step 6: Apply cluster-specific App-of-Apps
        # CLUSTER env var is set at job level
        echo "Applying App-of-Apps for ${CLUSTER}..."
        envsubst < manifests/argocd/03-app-of-apps.yaml | oc apply -f -
        echo "✅ App-of-Apps applied (path: ${GITOPS_ROOT})" >> $GITHUB_STEP_SUMMARY

        # Step 7: Wait for sync
        echo "Waiting for initial sync..."
        for i in {1..20}; do
          SYNC_STATUS=$(oc get application saif-apps -n openshift-gitops -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")
          HEALTH_STATUS=$(oc get application saif-apps -n openshift-gitops -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Unknown")

          if [ "$SYNC_STATUS" = "Synced" ]; then
            echo "✅ ArgoCD synced successfully" >> $GITHUB_STEP_SUMMARY
            break
          fi
          if [ "$i" -eq 20 ]; then
            echo "⚠️ ArgoCD sync pending (status: $SYNC_STATUS, health: $HEALTH_STATUS)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "Sync status: $SYNC_STATUS, Health: $HEALTH_STATUS ($i/20)"
          sleep 15
        done

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ ArgoCD bootstrap complete" >> $GITHUB_STEP_SUMMARY

    - name: Cluster Cleanup
      shell: bash
      run: |
        echo "### Cluster Cleanup" >> $GITHUB_STEP_SUMMARY

        # Delete assisted-installer namespace (no longer needed after install)
        if oc get namespace assisted-installer >/dev/null 2>&1; then
          oc delete namespace assisted-installer --wait=false
          echo "✅ Deleted assisted-installer namespace" >> $GITHUB_STEP_SUMMARY
        else
          echo "ℹ️ assisted-installer namespace not present" >> $GITHUB_STEP_SUMMARY
        fi

        # Clean up failed/completed installer pods in control plane namespaces
        CLEANED=0
        for ns in openshift-etcd openshift-kube-apiserver openshift-kube-controller-manager openshift-kube-scheduler; do
          # Delete Error pods (failed installers where retry succeeded)
          ERROR_PODS=$(oc get pods -n $ns --field-selector=status.phase=Failed -o name 2>/dev/null || true)
          if [ -n "$ERROR_PODS" ]; then
            echo "$ERROR_PODS" | xargs -r oc delete -n $ns
            CLEANED=$((CLEANED + 1))
          fi

          # Delete old Completed installer/pruner pods (keep last 2)
          COMPLETED_PODS=$(oc get pods -n $ns --field-selector=status.phase=Succeeded -o name 2>/dev/null | head -n -2 || true)
          if [ -n "$COMPLETED_PODS" ]; then
            echo "$COMPLETED_PODS" | xargs -r oc delete -n $ns
            CLEANED=$((CLEANED + 1))
          fi
        done

        if [ "$CLEANED" -gt 0 ]; then
          echo "✅ Cleaned up old installer pods" >> $GITHUB_STEP_SUMMARY
        else
          echo "ℹ️ No old pods to clean up" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Summary
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Configuration Applied" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| IDMS Verification | ✅ |" >> $GITHUB_STEP_SUMMARY

        if [ "${{ inputs.apply_idms }}" = "true" ]; then
          echo "| IDMS Application | ✅ |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| IDMS Application | Skipped |" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "${{ inputs.apply_argocd }}" = "true" ]; then
          echo "| ArgoCD Bootstrap | ✅ |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| ArgoCD Bootstrap | Skipped |" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Cleanup
      if: always()
      run: |
        if [ -n "${POST_PRIVATE_DIR:-}" ]; then rm -rf -- "$POST_PRIVATE_DIR"; fi
        rm -rf /tmp/idms-download
