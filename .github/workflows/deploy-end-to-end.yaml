name: 'Compute Deployment'

# Airgap image production and GitOps post-install use their owning pipelines.
# This wrapper calls only real Compute reusable workflows and declared inputs.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Compute operation; DRY-RUN validates files and plans UCS only'
        type: choice
        options: [DRY-RUN, DEPLOY]
        default: DRY-RUN
      phases:
        description: 'Selected Compute phases'
        type: choice
        options: [ucs, openshift, 'ucs,openshift']
        default: ucs
      server_target:
        description: 'Declared UCS profile name or ALL'
        type: string
        default: ALL
      cluster_name:
        description: 'Declared cluster name, required for openshift'
        type: string
        required: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    container:
      image: ${{ vars.RUNNER_CONTAINER_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate selected Compute inputs
        env:
          ACTION: ${{ inputs.action }}
          PHASES: ${{ inputs.phases }}
          CLUSTER: ${{ inputs.cluster_name }}
          SERVER_TARGET: ${{ inputs.server_target }}
          OPERATION: ${{ inputs.action == 'DRY-RUN' && 'Plan' || 'Activate' }}
          DOMAIN_STATE: Unchanged
        run: |
          set -euo pipefail
          case "$ACTION" in DRY-RUN|DEPLOY) ;; *) exit 1 ;; esac
          case "$PHASES" in ucs|openshift|ucs,openshift) ;; *) exit 1 ;; esac
          if [[ ",$PHASES," == *,ucs,* ]]; then
            python3 scripts/select-ucs-profiles.py
          fi
          if [[ ",$PHASES," == *,openshift,* ]]; then
            [[ "$CLUSTER" =~ ^[A-Za-z0-9_.-]+$ ]]
            test -f "data/openshift/$CLUSTER/metadata.yaml"
          fi

  deploy-ucs:
    needs: preflight
    if: contains(inputs.phases, 'ucs')
    uses: ./.github/workflows/ucs-deploy.yaml
    with:
      operation: ${{ inputs.action == 'DRY-RUN' && 'Plan' || 'Activate' }}
      server_target: ${{ inputs.server_target }}
      domain_state: Unchanged
    secrets: inherit

  deploy-openshift:
    needs: [preflight, deploy-ucs]
    if: always() && needs.preflight.result == 'success' && (needs.deploy-ucs.result == 'success' || needs.deploy-ucs.result == 'skipped') && contains(inputs.phases, 'openshift')
    uses: ./.github/workflows/openshift-deploy.yaml
    with:
      cluster_name: ${{ inputs.cluster_name }}
      action: ${{ inputs.action }}
    secrets: inherit
