# ArgoCD repository credentials for GitHub
# Uses GitHub PAT for authentication to private repo
apiVersion: v1
kind: Secret
metadata:
  name: github-repo-creds
  namespace: openshift-gitops
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/mahowlin/saif-gitops.git
  username: x-access-token
  password: ${ARGO_GIT_TOKEN}
