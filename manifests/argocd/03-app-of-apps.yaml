# Cluster-specific App-of-Apps
# Points to clusters/${CLUSTER}/ in saif-gitops
# ${CLUSTER} is substituted by envsubst at apply time
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saif-apps
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mahowlin/saif-gitops.git
    targetRevision: main
    path: clusters/${CLUSTER}
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
